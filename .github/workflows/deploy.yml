name: 部署个人博客到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://jzhg6.github.io
    steps:
      - name: 检出博客源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 检查并构建静态站点
        run: npm run check
      - name: 验证 Pages 产物
        run: |
          test -f out/index.html
          test -f out/zh/index.html
          test -f out/research/index.html
          test -f out/zh/research/index.html
          test -f out/projects/index.html
          test -f out/zh/projects/index.html
          test -f out/posts/index.html
          test -f out/zh/posts/index.html
          test -f out/posts/building-a-personal-worklog/index.html
          test -f out/zh/posts/building-a-personal-worklog/index.html
          test -f out/feed.xml
          test -f out/rss.xml
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -d out/_next/static
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
